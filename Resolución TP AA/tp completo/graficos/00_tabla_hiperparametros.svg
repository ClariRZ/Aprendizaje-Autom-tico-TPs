<rect x="70" y="669" width="1360" height="94" fill="#ffffff"/>
<text x="90" y="705" class="cell">K-NN</text><text x="410" y="705" class="cell">Vecinos = 3; 5; 9; 15; 25</text><text x="410" y="735" class="cell">Pesos = uniforme; distancia</text>
