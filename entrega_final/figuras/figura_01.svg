<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Bloques de información para predecir deserción</title>
<desc id="descripcion">Doce columnas candidatas al ingreso, cuatro del primer semestre y cuatro del segundo; otras siete no tienen fecha acreditada. Las 27 pueden utilizarse en el caso completo.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#252525}
.title{font-size:27px;font-weight:bold}
.subtitle{font-size:16px;fill:#555}
.stage{font-size:19px;font-weight:bold}
.body{font-size:16px}
.small{font-size:14px;fill:#555}
</style>
<rect width="1200" height="430" fill="white"/>
<text class="title" x="48" y="48">Qué información entra al modelo completo</text>
<text class="subtitle" x="48" y="78">El nombre de una variable no alcanza para certificar cuándo estuvo disponible</text>
<path d="M180 184 H1030" fill="none" stroke="#a6a6a6" stroke-width="4"/>
<path d="M1030 184 l-18 -10 v20 z" fill="#a6a6a6"/>
<circle cx="180" cy="184" r="21" fill="#555"/>
<circle cx="470" cy="184" r="21" fill="#b64545"/>
<circle cx="750" cy="184" r="21" fill="#b64545"/>
<circle cx="1030" cy="184" r="21" fill="#555"/>
<text class="stage" x="180" y="142" text-anchor="middle">Ingreso candidato</text>
<text class="body" x="180" y="229" text-anchor="middle">12 columnas</text>
<text class="small" x="180" y="255" text-anchor="middle">fecha real por confirmar</text>
<text class="stage" x="470" y="142" text-anchor="middle">1.er semestre</text>
<text class="body" x="470" y="229" text-anchor="middle">+ 4 columnas</text>
<text class="small" x="470" y="255" text-anchor="middle">actividad y notas</text>
<text class="stage" x="750" y="142" text-anchor="middle">2.º semestre</text>
<text class="body" x="750" y="229" text-anchor="middle">+ 4 columnas</text>
<text class="small" x="750" y="255" text-anchor="middle">actividad y notas</text>
<text class="stage" x="1030" y="142" text-anchor="middle">Target</text>
<text class="body" x="1030" y="229" text-anchor="middle">3 clases</text>
<text class="small" x="1030" y="255" text-anchor="middle">estado académico</text>
<rect x="48" y="305" width="1104" height="84" rx="10" fill="#f3f3f3"/>
<rect x="48" y="305" width="7" height="84" fill="#b64545"/>
<text class="body" x="72" y="335">+ 7 columnas sin fecha acreditada: deuda, matrícula, beca y cuatro parentales.</text>
<text class="small" x="72" y="365">12 + 4 + 4 + 7 = 27 para el caso completo; no supone predicción temprana al ingreso.</text>
</svg>
